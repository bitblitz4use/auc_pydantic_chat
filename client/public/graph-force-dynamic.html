	THIS EXAMPLE WAS DOWNLOADED FROM https://echarts.apache.org/examples/en/editor.html?c=graph-force-dynamic&random=14mzucwi37&theme=dark
-->
<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8">
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  
  <!-- Uncomment this line if you want to dataTool extension
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/extension/dataTool.min.js"></script>
  -->
  <!-- Uncomment this line if you want to use gl extension
  <script type="text/javascript" src="https://echarts.apache.org/en/js/vendors/echarts-gl/dist/echarts-gl.min.js"></script>
  -->
  <!-- Uncomment this line if you want to echarts-stat extension
  <script type="text/javascript" src="https://echarts.apache.org/en/js/vendors/echarts-stat/dist/ecStat.min.js"></script>
  -->
  <!-- Uncomment this line if you want to echarts-graph-modularity extension
  <script type="text/javascript" src="https://echarts.apache.org/en/js/vendors/echarts-graph-modularity/dist/echarts-graph-modularity.min.js"></script>
  -->
  <!-- Uncomment this line if you want to use map
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
  -->
  <!-- Uncomment these two lines if you want to use bmap extension
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=YOUR_API_KEY"></script>
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/extension/bmap.min.js"></script>
  -->

  <script type="text/javascript">
    (function () {
      var params = new URLSearchParams(window.location.search);
      var themeParam = params.get('theme');
      var isDark = themeParam
        ? themeParam === 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

      var dom = document.getElementById('container');
      var myChart = null;
      var data = null;
      var edges = null;
      var tick = null; // interval id
      var maxNodes = 200; // default, can be overridden via postMessage

      function bgFor(dark) { return dark ? '#0a0a0a' : '#ffffff'; }
      function edgeFor(dark) { return dark ? '#475569' : '#cbd5e1'; }
      var PRIMARY = '#ECBC31';

      function initData() {
        data = [
          {
            fixed: true,
            x: myChart.getWidth() / 2,
            y: myChart.getHeight() / 2,
            symbolSize: 20,
            id: '-1',
            itemStyle: { color: PRIMARY }
          }
        ];
        edges = [];
      }

      function startInterval() {
        if (tick) return;
        tick = setInterval(function () {
          if (data.length < maxNodes) {
            data.push({ id: data.length + '', itemStyle: { color: PRIMARY } });
            var source = Math.round((data.length - 1) * Math.random());
            var target = Math.round((data.length - 1) * Math.random());
            if (source !== target) {
              edges.push({
                source: source,
                target: target,
                lineStyle: { color: edgeFor(isDark), width: 1, opacity: 0.6 }
              });
            }
            myChart.setOption({ series: [{ data: data, edges: edges }] });
          }
        }, 200);
      }

      function stopInterval() {
        if (tick) {
          clearInterval(tick);
          tick = null;
        }
      }

      function createChart(dark) {
        var bg = bgFor(dark);
        document.body.style.backgroundColor = bg;
        dom.style.backgroundColor = bg;

        if (myChart) {
          stopInterval();
          myChart.dispose();
          myChart = null;
        }
        myChart = echarts.init(dom, dark ? 'dark' : null, { renderer: 'canvas', useDirtyRect: false });

        initData();

        var option = {
          backgroundColor: bg,
          series: [
            {
              type: 'graph',
              layout: 'force',
              animation: false,
              roam: true,
              data: data,
              force: { repulsion: 100, edgeLength: 5 },
              edges: edges,
              itemStyle: { color: PRIMARY },
              lineStyle: { color: edgeFor(dark), width: 1, opacity: 0.6 }
            }
          ]
        };
        myChart.setOption(option);
        startInterval();
        window.addEventListener('resize', myChart.resize);
      }

      // initial create
      createChart(isDark);

      // listen for theme + config + restart messages from parent
      window.addEventListener('message', function (e) {
        var msg = e && e.data;
        if (!msg || !msg.type) return;

        if (msg.type === 'theme') {
          var nextIsDark = msg.value === 'dark';
          if (nextIsDark !== isDark) {
            isDark = nextIsDark;
            createChart(isDark);
          }
        } else if (msg.type === 'config' && msg.value) {
          if (typeof msg.value.maxNodes === 'number' && msg.value.maxNodes > 0) {
            maxNodes = Math.floor(msg.value.maxNodes);
            // Trim if above new cap
            if (data && data.length > maxNodes) {
              data.length = maxNodes;
              edges = edges.filter(function (edge) {
                return Number(edge.source) < maxNodes && Number(edge.target) < maxNodes;
              });
              myChart.setOption({ series: [{ data: data, edges: edges }] });
            }
          }
        } else if (msg.type === 'restart') {
          // fully recreate chart to ensure background and styles are set consistently
          stopInterval();
          createChart(isDark);
        }
      });

      // if no explicit theme param, also track OS preference changes
      if (!themeParam && window.matchMedia) {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        var handler = function (ev) {
          var nextIsDark = ev.matches;
          if (nextIsDark !== isDark) {
            isDark = nextIsDark;
            createChart(isDark);
          }
        };
        if (mql.addEventListener) mql.addEventListener('change', handler);
        else if (mql.addListener) mql.addListener(handler);
      }
    })();
  </script>
</body>
</html>
